[workspace]
members = [
  "crates/trailgen-acceptance",
  "crates/trailgen-core",
  "crates/trailgen-data",
  "crates/trailgen-cli",
  "crates/trailgen-gui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/adequate-trailgen"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
bytemuck = { version = "1.24.0", features = ["derive"] }
clap = { version = "4.5.40", features = ["derive"] }
crossbeam-channel = "0.5.15"
directories = "6.0.0"
dwemer_poolrooms = "0.7.0"
egui = "=0.34.3"
egui-wgpu = "=0.34.3"
egui-winit = "=0.34.3"
fast-mvt = { version = "0.6.1", default-features = false, features = ["reader"] }
futures-util = "0.3.31"
geo-types = "0.7.19"
lyon_tessellation = "1.0.20"
num-traits = "0.2.19"
pmtiles = { version = "0.23.1", default-features = false, features = ["http-async", "mmap-async-tokio", "reqwest-rustls", "write"] }
png = "0.18.0"
roxmltree = "0.20.0"
osmpbfreader = "0.19.1"
pollster = "0.4"
rfd = "0.17.2"
protobuf = "3.7.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
rstar = "0.12.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
sha2 = "0.10.9"
shapefile = "0.8.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
tiff = "0.11.3"
tokio = { version = "1.48.0", features = ["rt"] }
toml = "0.8.23"
trailgen-core = { path = "crates/trailgen-core" }
trailgen-data = { path = "crates/trailgen-data" }
trailgen-gui = { path = "crates/trailgen-gui" }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[workspace.dependencies.egui-tester]
git = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/egui-tester"
rev = "87d5d3548be054f0ccbe26de07687544bd12546a"
version = "0.3.0"

[workspace.dependencies.egui-tester-witness]
git = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/egui-tester"
rev = "87d5d3548be054f0ccbe26de07687544bd12546a"
version = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
