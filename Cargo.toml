[workspace]
members = [
  "crates/trailgen-acceptance",
  "crates/trailgen-contract",
  "crates/trailgen-core",
  "crates/trailgen-data",
  "crates/trailgen-cli",
  "crates/trailgen-gui",
  "crates/trailgen-portability",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/adequate-trailgen"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
directories = "6.0.0"
brass_poolrooms = "0.14.0"
egui = "=0.36.1"
egui-wgpu = { version = "=0.36.1", default-features = false }
eternalist-apps = "0.9.2"
fast-mvt = { version = "0.6.2", default-features = false, features = ["reader"] }
futures-util = "0.3.34"
geo-types = "0.7.20"
lyon_tessellation = "1.0.20"
num-traits = "0.2.19"
pmtiles = { version = "0.24.0", default-features = false, features = ["http-async", "mmap-async-tokio", "reqwest-rustls", "write"] }
png = "0.18.1"
roxmltree = "0.21.1"
osmpbfreader = "0.19.1"
pollster = "1.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
protobuf = "3.7.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
rmp-serde = "1.3.1"
rstar = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
shapefile = "0.9.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tiff = "0.11.3"
tokio = { version = "1.53.1", features = ["rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
trailgen-core = { path = "crates/trailgen-core", version = "0.3.11" }
trailgen-contract = { path = "crates/trailgen-contract", version = "0.3.11" }
trailgen-data = { path = "crates/trailgen-data", version = "0.3.11" }
trailgen-gui = { path = "crates/trailgen-gui", version = "0.3.11" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

[workspace.dependencies.egui-tester]
version = "0.9.7"

[workspace.dependencies.egui-tester-witness]
version = "0.9.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
