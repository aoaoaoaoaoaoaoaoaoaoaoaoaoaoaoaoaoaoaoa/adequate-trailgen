[workspace]
members = ["crates/trailgen-core", "crates/trailgen-cli", "crates/trailgen-gui"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/adequate-trailgen"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
crossbeam-channel = "0.5.15"
directories = "6.0.0"
dwemer_poolrooms = "0.1.0"
egui = "=0.34.3"
egui-wgpu = "=0.34.3"
egui-winit = "=0.34.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
roxmltree = "0.20.0"
osmpbfreader = "0.19.1"
pollster = "0.4"
protobuf = "3.7.2"
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "rustls-tls"] }
rstar = "0.12.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
shapefile = "0.8.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
tiff = "0.11.3"
toml = "0.8.23"
trailgen-core = { path = "crates/trailgen-core" }
trailgen-gui = { path = "crates/trailgen-gui" }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
