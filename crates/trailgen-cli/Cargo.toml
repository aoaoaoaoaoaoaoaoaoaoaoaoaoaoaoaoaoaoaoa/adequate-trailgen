[package]
name = "trailgen"
version = "0.3.0"
description = "Native trail-design workbench and narrow debug shell."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gis", "hiking", "routing", "geojson", "gpx"]
categories = ["command-line-utilities", "science::geo"]

[features]
egui-test = ["trailgen-gui/egui-test"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
trailgen-gui.workspace = true

[lints]
workspace = true

[package.metadata.packager]
product-name = "Trailgen"
identifier = "dev.adequate.trailgen"
publisher = "Eternalist"
category = "Travel"
binaries = [{ path = "trailgen", main = true }]
resources = [
  { src = "../../LICENSE-MIT", target = "LICENSE-MIT" },
  { src = "../../LICENSE-APACHE", target = "LICENSE-APACHE" },
]

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[package.metadata.packager.nsis]
compression = "lzma"
installer-mode = "currentUser"
languages = ["English"]
