egui-wgpu.workspace = true
egui-tester-witness = { workspace = true, optional = true, features = ["egui"] }
fast-mvt.workspace = true
futures-util.workspace = true
geo-types.workspace = true
lyon_tessellation.workspace = true
pmtiles.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
trailgen-core.workspace = true
trailgen-contract.workspace = true
trailgen-data.workspace = true
trailgen-shell.workspace = true
zstd.workspace = true

[lints]
workspace = true
