[package]
name = "trailgen-gui"
version = "0.1.0"
description = "Native Dwemer Poolrooms workbench for constrained trail-loop generation."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.96"
readme = "../../README.md"
keywords = ["gis", "hiking", "routing", "egui", "wgpu"]
